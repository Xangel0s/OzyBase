name: OzyBase CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build Frontend & Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend (Vite / React)
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy Frontend Assets for Go Embed
        run: |
          mkdir -p internal/api/frontend_dist
          cp -r frontend/dist/* internal/api/frontend_dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Modules & Build Backend
        run: |
          go mod verify
          go build -v ./cmd/ozybase

  sdk-build:
    name: Build Client SDK (@ozybase/js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build SDK
        run: |
          cd packages/ozybase-js
          npm install
          npm run build
