name: OzyBase CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.24'

jobs:
  # Job 1: Validación de Código
  validate:
    name: Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -l .
            exit 1
          fi

  # Job 2: Build & Test
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: validate
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: ozybase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build binary
        run: |
          go build -v -ldflags="-X github.com/Xangel0s/OzyBase/internal/buildinfo.Version=${GITHUB_REF_NAME} -X github.com/Xangel0s/OzyBase/internal/buildinfo.Commit=${GITHUB_SHA}" -o ozybase ./cmd/ozybase
          ./ozybase --version || echo "Binary built successfully"

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres_test_password@localhost:5432/ozybase_test?sslmode=disable
          JWT_SECRET: test_secret_key_for_ci_12345
          DEBUG: false
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # Job 3: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=json -out=gosec-report.json ./... || true

      - name: Upload gosec report
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.json
        continue-on-error: true

  # Job 4: Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m --issues-exit-code=0

  # Job 5: Production Readiness Check
  production-check:
    name: Production Readiness
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Goroutine Shutdown
        run: |
          echo "🔍 Checking for graceful shutdown implementation..."
          if ! grep -q "func (h \*Handler) Shutdown()" internal/api/handlers.go; then
            echo "❌ Handler.Shutdown() not found"
            exit 1
          fi
          if ! grep -q "func (b \*Broker) Shutdown()" internal/realtime/broker.go; then
            echo "❌ Broker.Shutdown() not found"
            exit 1
          fi
          if ! grep -q "defer h.Shutdown()" cmd/ozybase/main.go; then
            echo "❌ defer h.Shutdown() not found in main.go"
            exit 1
          fi
          echo "✅ Graceful shutdown implemented"

      - name: Verify Token Security
        run: |
          echo "🔍 Checking token security..."
          if ! grep -q 'os.Getenv("DEBUG") == "true"' internal/api/auth.go; then
            echo "❌ Token not protected by DEBUG flag"
            exit 1
          fi
          echo "✅ Token only exposed in DEBUG mode"

      - name: Verify Error Handling
        run: |
          echo "🔍 Checking error handling..."
          if ! grep -q "func (db \*DB) HasColumn(ctx context.Context, tableName, columnName string) (bool, error)" internal/data/db.go; then
            echo "❌ HasColumn does not return error"
            exit 1
          fi
          echo "✅ Error handling implemented"

      - name: Check for Critical TODOs
        run: |
          echo "🔍 Checking for critical TODOs..."
          if grep -r "TODO.*Remove in true production" internal/; then
            echo "⚠️ Critical TODOs found - review before production"
            exit 1
          fi
          echo "✅ No critical TODOs found"

      - name: Production Readiness Summary
        run: |
          echo "📊 Production Readiness Check"
          echo "=============================="
          echo "✅ Goroutine shutdown: PASS"
          echo "✅ Token security: PASS"
          echo "✅ Error handling: PASS"
          echo "✅ Critical TODOs: PASS"
          echo ""
          echo "🎉 All production checks passed!"

  # Job 6: Build Docker Image (optional)
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, security, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ozybase:${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 7: Final Status
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [validate, test, security, lint, production-check]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.production-check.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ All CI checks passed successfully!"
