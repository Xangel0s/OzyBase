name: Release OzyBase

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Copy Frontend Assets for Go Embed
        run: |
          mkdir -p internal/api/frontend_dist
          cp -r frontend/dist/* internal/api/frontend_dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Binaries (Linux, Windows, macOS Intel + Apple Silicon)
        run: |
          mkdir -p release_dist
          TAG="${{ github.ref_name }}"
          LDFLAGS="-s -w -X 'github.com/Xangel0s/OzyBase/internal/version.Version=${TAG}'"

          echo "Building Linux amd64..."
          GOOS=linux   GOARCH=amd64  go build -ldflags="$LDFLAGS" -o release_dist/ozybase-linux-amd64        ./cmd/ozybase

          echo "Building Linux arm64..."
          GOOS=linux   GOARCH=arm64  go build -ldflags="$LDFLAGS" -o release_dist/ozybase-linux-arm64        ./cmd/ozybase

          echo "Building Windows amd64..."
          GOOS=windows GOARCH=amd64  go build -ldflags="$LDFLAGS" -o release_dist/ozybase-windows-amd64.exe  ./cmd/ozybase

          echo "Building macOS Intel (amd64)..."
          GOOS=darwin  GOARCH=amd64  go build -ldflags="$LDFLAGS" -o release_dist/ozybase-darwin-amd64       ./cmd/ozybase

          echo "Building macOS Apple Silicon (arm64)..."
          GOOS=darwin  GOARCH=arm64  go build -ldflags="$LDFLAGS" -o release_dist/ozybase-darwin-arm64       ./cmd/ozybase

          echo "Generating SHA256 checksums..."
          cd release_dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
