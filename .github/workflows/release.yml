name: Release OzyBase

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Copy Frontend Assets for Go Embed
        run: |
          mkdir -p internal/api/frontend_dist
          cp -r frontend/dist/* internal/api/frontend_dist/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries (Linux, Windows, macOS)
        run: |
          mkdir -p release_dist
          TAG_NAME="${{ github.ref_name }}"
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X 'github.com/Xangel0s/OzyBase/internal/version.Version=${TAG_NAME}'" -o release_dist/ozybase-linux-amd64 ./cmd/ozybase
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X 'github.com/Xangel0s/OzyBase/internal/version.Version=${TAG_NAME}'" -o release_dist/ozybase-windows-amd64.exe ./cmd/ozybase
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X 'github.com/Xangel0s/OzyBase/internal/version.Version=${TAG_NAME}'" -o release_dist/ozybase-darwin-arm64 ./cmd/ozybase

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
